<script>
/* To add media later: put items in a project's `media` list, e.g.
   {t:"img", src:"data:image/jpeg;base64,...", cap:"Final assembly"} or {t:"video", src:"...", cap:"Flight test"}
   and set `cover` to an image src to replace the colored placeholder. */
var CATS=["Aerospace","Research","Projects","FIRST Robotics"];
var P=[
{id:"advanced-class",cat:0,h:205,title:"Advanced Class VTOL Tailsitter",sub:"Autonomous hybrid VTOL for SAE Aero Advanced Class",meta:"Penn Aerial Robotics · Advanced Class Co-Lead · 2026",
 facts:[["1st place","Design, SAE Aero West"],["\u221220%","weight, 2026 to 2027"],["+15%","cruise speed, 2026 to 2027"],["+32%","theoretical score increase"]],
 body:"<p class='mission'><b>The mission:</b> SAE Aero Design Advanced Class (2026). Fly an aircraft that autonomously delivers a payload to a designated landing zone and then retrieves it. The more of the mission flown autonomously, the more points a team earns, and transitioning between flight modes is part of the challenge.</p><div class='vwrap'><iframe src='https://www.youtube-nocookie.com/embed/Xp5qabT8cr8' title='Project video' loading='lazy' allow='accelerometer; encrypted-media; picture-in-picture; fullscreen' allowfullscreen></iframe></div><a class='vlink small' href='https://youtu.be/Xp5qabT8cr8' target='_blank' rel='noopener'><b>▶ Open on YouTube</b><span>If the player doesn’t load, watch it there.</span></a><p>A fully autonomous tailsitter that takes off vertically, flies as a fixed wing, and transitions between the two modes on its own. I help lead the design, contribute to structures and CAD, and run CAD, FEA, CFD, and flight testing.</p><h2>Rover payload</h2><p>The aircraft carries an autonomous tracked rover that I also lead. See <a href=\"#advanced-payload\">the payload project</a>.</p>",
 sections:[{"h":"2026 aircraft: aerodynamic design","t":"<ul><li><b>Goal:</b> minimize wing area while keeping stable flight characteristics.</li><li><b>Method:</b> optimized the planform in XFLR5 through a parametric analysis of wingspan, chord length, taper ratio, and twist.</li></ul>","figs":[["a26x","XFLR5 analysis of the 2026 planform"]]},{"h":"2026 aircraft: mechanical design","t":"<ul><li><b>Ownership:</b> owned the CAD of the aircraft.</li><li><b>Iteration:</b> rapidly revised the design based on structural component-level testing and flight tests.</li></ul>","figs":[["a26c","SolidWorks CAD of the 2026 aircraft"]]},{"h":"Flight testing","t":"<ul><li><b>Vehicle electronic integration:</b> prepared vehicles for flight tests by integrating the electronic components onto the airframe: flight controller, motors, ESCs, servos, and more.</li><li><b>Flight testing:</b> planned clear flight test objectives, set up missions in QGroundControl, and configured the vehicles.</li><li><b>Failure analysis:</b> analyzed failures using PX4 logs and PID-tuned parameters. In the pitch-rate log shown here, the vehicle oscillated in VTOL mode, so I increased D and decreased P.</li></ul>","figs":[["ftphoto","Tailsitter in flight test"],["ftplot","PX4 log: pitch angular rate in VTOL mode"]]},{"h":"2027 aircraft: smaller and lighter","t":"<ul><li>Redesigned for the 2027 competition year.</li><li><b>Weight:</b> cut by 20% from the 2026 aircraft, along with a major reduction in overall size.</li><li><b>Speed:</b> cruise speed up 15%.</li><li><b>Scoring:</b> together, these changes theoretically increase our competition score by 32%.</li></ul>","figs":[["a27c","SolidWorks CAD of the 2027 aircraft"],["a2627","2026 and 2027 aircraft compared"],["a27","The 2027 Advanced Class aircraft"]]}],
 tags:"SolidWorks · XFLR5 · ANSYS FEA · CFD · ESP32 · Computer vision"},
{id:"advanced-payload",cat:0,h:165,title:"Advanced Class Rover Payload",sub:"Autonomous tracked rover that loads itself into the VTOL",meta:"Penn Aerial Robotics · Advanced Class Co-Lead · 2026",
 facts:[["ESP32","motor control"],["IMU","heading estimation"],["AprilTag","vision navigation"]],
 body:"<p class='mission'><b>The mission:</b> SAE Aero Design Advanced Class (2026). The mission requires the aircraft to deliver a payload to a designated landing zone and retrieve it, with extra points for doing it autonomously. This rover is the payload for that mission.</p><div class='vwrap vert'><iframe src='https://www.youtube-nocookie.com/embed/AspzHtavQak' title='Project video' loading='lazy' allow='accelerometer; encrypted-media; picture-in-picture; fullscreen' allowfullscreen></iframe></div><a class='vlink small' href='https://youtu.be/AspzHtavQak' target='_blank' rel='noopener'><b>▶ Open on YouTube</b><span>If the player doesn’t load, watch it there.</span></a><p>A tracked rover payload for our SAE Aero Advanced Class VTOL aircraft. It drives to the aircraft on its own, attaches, and hoists itself aboard using a self-contained climbing system. I lead its development.</p><h2>Controls and electronics</h2><p>The rover combines ESP32-based motor controls, wheel encoders, and an IMU for heading estimation, with a Wi-Fi dashboard for testing. Planned capabilities include AprilTag-based navigation and a climbing mechanism for self-loading into the aircraft.</p>",
 sections:[{"h":"Designing for center of gravity","t":"<ul><li><b>Goal:</b> keep the rover's center of gravity as close as possible to where the aircraft's CG needs to be.</li><li><b>Approach:</b> I have been iterating the rover CAD to make the whole vehicle flatter, which brings the payload CG closer to the aircraft CG along the vertical (z) axis.</li><li><b>Payoff:</b> a payload CG near the target means the aircraft can fly at the CG from the aerodynamic analysis, which keeps stability and trim close to the optimum without ballast or compromises elsewhere.</li></ul>","figs":[["rcad","SolidWorks CAD of the rover payload"]]}],
 tags:"SolidWorks · Mechanical design · Embedded controls · Electronics integration · Computer vision"},
{id:"micro-class",cat:0,h:190,title:"SAE Aero Micro Class STOL Aircraft",sub:"SAE Aero Design Micro Class: high-lift lightweight STOL aircraft, 3rd in the U.S.",meta:"Penn Aerial Robotics \u00b7 SAE Aero Micro Class Lead \u00b7 2026",
 facts:[["3rd in U.S.","SAE Aero Design West"],["1.07 m","wingspan"],["24.95 ft","takeoff distance"],["4.7 lb","liquid payload capacity"],["FOS 1.54","wing spar"]],
 body:"<p class='mission'><b>The mission:</b> SAE Aero Design Micro Class (2026). Build a very small radio-controlled aircraft that takes off in a short distance while carrying as much liquid (water) payload as possible. The score rewards a small wingspan and a low aircraft weight.</p><div class='vwrap'><iframe src='https://www.youtube-nocookie.com/embed/4XK94FgUuoc' title='Project video' loading='lazy' allow='accelerometer; encrypted-media; picture-in-picture; fullscreen' allowfullscreen></iframe></div><a class='vlink small' href='https://youtu.be/4XK94FgUuoc' target='_blank' rel='noopener'><b>▶ Open on YouTube</b><span>If the player doesn’t load, watch it there.</span></a><p>As the Penn Aerial Robotics Micro Class Lead, I led the design, manufacturing, and iterative flight testing of a 1.07 m wingspan short-takeoff aircraft for the 2026 SAE Aero Design Micro Class. The competition rewarded high payload capacity, low empty mass, short takeoff distance, and reduced wingspan, which made aerodynamics and structure a tightly coupled optimization problem. Our final aircraft placed 3rd in the U.S. at SAE Aero Design West.</p>",
 sections:[{"h": "Aircraft at a glance", "t": "<ul><li>3.5 ft (1.07 m) wingspan, aspect ratio 4.0, in a blown-lift STOL configuration.</li><li>2 lb empty weight and 6.7 lb loaded, carrying 4.7 lb of liquid water.</li><li>19 mph takeoff speed and about 25 ft takeoff distance.</li><li><b>Propulsion:</b> two Skywalker 2316 1250 kV motors turning 14 in propellers, on a 4S 1050 mAh 95C LiPo.</li><li><b>Controls:</b> four MKS HV69 servos and two Predator 40 A ESCs, with an isolated BEC.</li><li><b>Airfoils:</b> a custom modified S1223 on the wing and an SD8020 on the tail.</li><li>Precision laser-cut balsa fuselage, wing, and tail, with tail-dragger landing gear.</li><li>Competed at SAE Aero Design West in Fort Worth, TX, April 17\u201319, 2026.</li></ul>", "figs": [["ms", "Tempest specification sheet"]]}, {"h": "Aerodynamic design and airfoil selection", "t": "<ul><li><b>Design objective:</b> maximum lift over cruise efficiency and speed, to match the short-takeoff scoring constraints.</li><li><b>Airfoil:</b> I started from the Selig S1223, a high-lift baseline from the Airfoil Tools repository, and iteratively modified its geometry in XFOIL to maximize Cl.</li><li><b>Validation:</b> in XFLR5 I evaluated Cl, Cd, Cl/Cd, lift distributions, and Cm to assess stability, aerodynamic efficiency, and the range of operable angles of attack. That data fed a custom takeoff and performance model that gave a good final configuration.</li><li><b>Final configuration:</b> 1.07 m wingspan, AR 4.0, twin 14 in propellers, and a 24.95 ft takeoff.</li></ul>", "figs": [["ma", "Final airfoil (iteration 3) profile"], ["mx", "XFLR5 model with the spanwise lift distribution"]]}, {"h": "Structural design and material selection", "t": "<ul><li><b>Load definition:</b> I extracted XFLR5 spanwise lift data and used a 1.5 g design condition, giving a 64.75 N wing load and a 7.71 N\u00b7m bending moment.</li><li><b>FEA optimization:</b> I began with the simplest root-fixed beam spar under aerodynamic loading, then iteratively sized cutouts and added flanges in the high-bending regions near the root. The final spar has a factor of safety of 1.54.</li><li><b>Materials:</b> lightweight balsa for the wing structure, plywood for concentrated motor loads, and carbon fiber for the extended tail boom, all validated through physical component testing.</li></ul>", "figs": [["mf1", "FEA stress plot of the wing spar"], ["mt2", "Spar load test with hanging weights"], ["mf2", "FEA stress plot of a wing rib"], ["mt1", "Rib load test with a hanging weight"]]}, {"h": "CAD, manufacturing, and system integration", "t": "<ul><li><b>CAD ownership:</b> I owned the full-aircraft SolidWorks assembly and component integration.</li><li><b>Lightweight fabrication:</b> laser-cut balsa and CA glue for low-mass construction.</li><li><b>Self-jigging joints:</b> tab-and-slot rib and spar joints for faster, aligned assembly.</li><li><b>Impact durability:</b> carbon-fiber landing gear to absorb landing shocks at low weight.</li></ul>", "figs": [["mc", "SolidWorks model of Tempest"], ["mm", "Laser-cut balsa structure"]]}],
 tags:"SolidWorks \u00b7 XFLR5 \u00b7 XFOIL \u00b7 ANSYS FEA \u00b7 Structural testing \u00b7 Laser cutting \u00b7 Machining"},
{id:"dronehacks",cat:0,h:60,title:"Stanford DroneHacks 2026",sub:"A camera-only autonomous drone: a simulator built overnight, a first-of-its-kind path-following flight, and a mechanical root cause found in the flight logs",meta:"Stanford University \u00b7 Horizons Drone Hacks \u00b7 Team Blue Ravens \u00b7 Nov 2026",
 facts:[["1st","team to follow a path on the real drone"],["61.8 s","simulated course time after overnight tuning"],["1.4\u00d7","front-to-rear thrust from a 1.9 cm CG offset"],["0","crashes"]],
 body:"<p class='mission'><b>The challenge:</b> Stanford DroneHacks 2026 (Horizons Drone Hacks). Teams program a small camera-only drone to fly an obstacle course on its own, through a tunnel and a window to a landing pad, with no GPS and no human input. Our team, the Blue Ravens, had five students from different universities.</p><div class='vwrap vert'><iframe src='https://www.youtube-nocookie.com/embed/iYXT6D59V5o' title='Project video' loading='lazy' allow='accelerometer; encrypted-media; picture-in-picture; fullscreen' allowfullscreen></iframe></div><a class='vlink small' href='https://youtube.com/shorts/iYXT6D59V5o' target='_blank' rel='noopener'><b>\u25b6 Open on YouTube</b><span>If the player doesn\u2019t load, watch it there.</span></a><!--figs:dhfly|The drone on the real course, hover test in the netted arena--><p>I specialized in post-flight review and failure analysis: logging every run, reading PX4 ULogs, ROS bags, and Foxglove replays to find root causes, and troubleshooting the Pixhawk in QGroundControl. I also did the CAD of the drone and of the course map, and tracked down mechanical failures.</p><h2>The drone</h2><!--figs:dhcad|CAD of the drone: frame, motors, electronics stack, forward stereo camera, and battery--><p>A compact quadrotor carrying a Luxonis OAK-D S2 stereo camera at the front, a Jetson onboard computer, and a Pixhawk running PX4, with the battery mounted on top of the electronics stack. The camera was the only sensor we had for navigation.</p><h2>The system</h2><!--figs:dharch|System architecture: one camera in, flight commands out--><p>The organizers supplied the flight interface, a starter project, and a grading simulator. On top of that, NVIDIA Isaac ROS cuVSLAM turned the camera feed into visual-inertial odometry, an obstacle grid and planner chose velocity commands, and PX4 flew the vehicle. We wrote the planner and safety logic in Python and ROS 2.</p><h2>Building the simulator</h2><!--figs:dhsim|Our Gazebo-based simulator replaying a run;dhmap|Planned waypoints and spline route on the course map--><p>We started the simulator around 11:52 PM and finished it at 4:10 AM on Nov 7, one of the first teams to do so. Smoother spline turns gave better camera parallax, and we optimized the course time to about 61.8 seconds overnight. Because it ran unattended, we used it to test several ideas at once (MPPI, signed distance fields, a navigation reference, and wall seeking) and to collect ROS bag data automatically.</p><h2>Testing and post-flight review</h2><!--figs:dhfox|Foxglove replay of a run: depth, camera, and route in one view;dhfox2|Foxglove post-flight review: route, height, uncertainty, and flight-mode charts on one clock--><p>We tested in steps from cheap to risky: unit tests, simulation through the real flight interface, A/B runs between builds, hand-carried walkthroughs, tethered hovers, and then real flight. Each step caught a class of bug before it could cost a crash. The simulator alone exposed six real problems, including a vision bridge that withheld useful data, a corner that spun the drone in place, and a landing that never disarmed.</p><p>Every sim run and real flight wrote a ROS bag. In Foxglove we replayed each one with the planned path against the estimate and the sim ground truth, height, uncertainty, and flight-mode timelines on one clock, and the live depth and camera feeds, so we could see what the drone saw. PX4 ULogs then gave us the root causes.</p><h2>Our first test flight</h2><!--figs:dhpath|Real flight: planned route versus the path the drone flew;dhlean|Every take-off drifted back-left, so we lean against it--><p>Our first test flight was our only one before the recorded run, and we became the first team to follow a path. The Foxglove replay showed the route completed, but the drone flew 0.22 m left of its path, drifted 0.38 m back-left during the 3.8 s climb, and reached only about 15% of the commanded velocity.</p><h2>Root cause: a mechanical problem</h2><!--figs:dhmotor|Front motors carry 1.4\u00d7 the rear thrust, unchanged at release;dhpitch|1.5\u00b0 nose-up at lift-off that the controller did not ask for--><p>The flight log pointed at the airframe, not the software. The camera sat 1.9 cm forward of the center of gravity, so the front propellers carried 1.4 times the thrust of the rear ones. At release the drone pitched 1.5\u00b0 nose-up with no change in motor commands, tilting thrust backward and drifting about 0.2 m until PX4 recovered roughly 2 seconds later. It is the same kind of center-of-gravity problem I work on for the Advanced Class aircraft. We countered it by leaning the take-off against the drift.</p><h2>Latency was also costing us</h2><!--figs:dhvision|Median vision age at PX4 for each depth configuration--><p>During a field recording, the age of vision data at PX4 climbed from 75 ms to 200\u2013400 ms, past PX4\u2019s 200 ms cutoff. A load test isolated the cause: any process subscribing to the camera images, including our own Jetson depth node, pushed it over. The stereo images alone use about 118 of 143 MB/s of USB bandwidth. Switching to the camera\u2019s on-board depth brought vision age back to about 25 ms.</p><h2>One problem, four solutions</h2><!--figs:dhmppi|BlueRaven MPPI: what we added beyond textbook MPPI;dhwall|Failure case: a blank wall made vision tracking drift--><p>With two theories about the core issue (take-off or route), we split into four approaches: a closed-loop return to the take-off point, a forward lean against the drift, a signed-distance-function planner, and WallSeek, which flies straight lines parallel to walls and stops on depth at a 0.8 m standoff. A sampling-based MPPI planner became our main flight program, with a safety shield, a push estimator, latency compensation, and a virtual net fence that treats the arena\u2019s invisible nets as walls. In simulation, WallSeek\u2019s hold returned the drone to within 0.05\u20130.06 m of its take-off point while a position-integral hold orbited, but the real drone responded faster than the sim, so we judged each hold on the real drone.</p><h2>The result</h2><p>Our first scored run (MPPI, full course) earned 10 raw points. The logs ruled out a yaw offset and showed that the run started 2.8 minutes after boot, when only 12% of depth frames were used, so the drone went stop-and-go and landed. We fixed that timing bug. On the second run the depth data and the whole pipeline were healthy, and the remaining drift came from cuVSLAM\u2019s own estimate, the limit of a camera-only drone. In simulation with the real window, the full course finished 2 out of 2 times, landing 0.10\u20130.12 m from the pad center.</p><p>Two hours before our recorded run we had done zero tests, so our test run was our recorded run. We adapted, changed course, and never crashed, which was the real success. Thank you to the DroneHacks organizers, sponsors, and technical mentors.</p>",
 tags:"PX4 \u00b7 ULog analysis \u00b7 ROS 2 \u00b7 ROS bags \u00b7 Foxglove \u00b7 QGroundControl \u00b7 Pixhawk \u00b7 CAD \u00b7 Gazebo \u00b7 NVIDIA Isaac ROS cuVSLAM \u00b7 Luxonis OAK-D \u00b7 Python"},
{id:"iarc-drone",cat:0,h:195,title:"IARC Autonomous Drone Swarm",sub:"Quadrotors for multi-UAV hazard mapping and safe-route planning",meta:"Penn Aerial Robotics \u00b7 IARC Mission 10 Mechanical Lead",
 facts:[["100 m","mapping field"],["Carbon fiber","quadrotor frame"]],
 body:"<p class='mission'><b>The mission:</b> International Aerial Robotics Competition, Mission 10 (\u201cEscape Through the Minefield\u201d). Use a swarm of four autonomous drones, each under 1 lb (453 g), to scout a 100 m minefield, map a safe path, and guide a person across before time runs out.</p><p>Penn Aerial Robotics\u2019 entry for the International Aerial Robotics Competition (IARC) Mission 10: a swarm of autonomous quadrotors that map hazards and plan safe routes across a 100 m field. I lead the mechanical design of the drones.</p><h2>What I did</h2><ul><li>Led quadrotor mechanical design, CAD, and electromechanical wiring.</li><li>Designed custom 3D-printed mounts for the electronics, including the GPS and flight stack.</li><li>Ran FEA on the carbon-fiber quadrotor frame.</li><li>Developing the hardware for autonomous multi-UAV hazard mapping and route planning.</li></ul>",
 tags:"SolidWorks \u00b7 FEA \u00b7 3D printing \u00b7 Electromechanical wiring"},
{id:"regular-class",cat:0,h:225,title:"SAE Aero Regular Class Aircraft",sub:"SAE Aero Design Regular Class: 10 ft wingspan multi-engine cargo plane",meta:"Penn Aerial Robotics \u00b7 SAE Aero Regular Class \u00b7 2026",
 facts:[["3rd","Presentation, SAE Aero West"],["10 ft","wingspan"],["55 lb","maximum weight"],["100 ft","takeoff at max weight"]],
 body:"<p class='mission'><b>The mission:</b> SAE Aero Design Regular Class (2026). Fly a multi-engine cargo aircraft that lifts as much payload as possible within a 10 ft wingspan limit. Payload increases after every successful flight, and with the power limiter removed, teams trade off takeoff current draw against battery endurance.</p><p>Penn Aerial Robotics\u2019 Regular Class entry is a high-lift aircraft with a 10 ft wingspan, designed for a maximum weight of 55 lb. At that weight it takes off in about 100 ft. The team placed 3rd in the Regular Class presentation.</p><h2>My role: tail design and CAD</h2><p>I was put in charge of the tail, from the first sizing calculations through the finished CAD model. The tail has to keep a 55 lb, multi-engine aircraft controllable through takeoff, climb, and landing, so it had to be sized and checked carefully.</p><ul><li><b>Sizing by hand:</b> I did the hand calculations for the elevator area the aircraft needs and for how far the tail sits from the center of gravity. The two are linked: a tail farther from the CG has more leverage, so the same control authority needs less area.</li><li><b>Aerodynamic analysis:</b> I ran an aerodynamic analysis of the tail to confirm that the sized surfaces gave the control and stability the aircraft needed.</li><li><b>Structural analysis:</b> I performed structural analysis on the tail, so it could carry its flight loads without adding more weight than necessary.</li><li><b>CAD ownership:</b> I modeled the tail in CAD and kept the model current as the sizing and analysis results came in.</li></ul>",tags:"Hand calculations · CAD · Aerodynamic analysis · Structural analysis"},
{id:"active-grid",cat:1,h:200,title:"AWARE Lab: Water Channel Active Grid",sub:"Programmable turbulence for the AWARE Lab water channel",meta:"AWARE Lab, Penn \u00b7 Funded Undergraduate Researcher \u00b7 2026",
 facts:[["25","winglets on 5 shafts"],["20 ft","recirculating water channel"],["3.1 N\u00b7m","closed-loop steppers"],["Published","APS DFD 2026 abstract"],["Presented","Frontiers of Energy Research"]],
 body:"<div class='vwrap'><iframe src='https://www.youtube-nocookie.com/embed/JKvdk_AGa38' title='Project video' loading='lazy' allow='accelerometer; encrypted-media; picture-in-picture; fullscreen' allowfullscreen></iframe></div><a class='vlink small' href='https://youtu.be/JKvdk_AGa38' target='_blank' rel='noopener'><b>▶ Open on YouTube</b><span>If the player doesn’t load, watch it there.</span></a><p>I designed and built a removable active grid for the AWARE Lab\u2019s 20 ft recirculating water channel at Penn, working with Leo Feng and Christopher Bianco in research led by Professor Nathaniel Wei and funded through VIPER. The grid is 5 \u00d7 5: 25 winglets on 5 independently controlled shafts, driven by closed-loop stepper motors so the flow can be forced in programmable ways.</p><h2>Why a water channel and an active grid</h2><ul><li>Controlled laboratory turbulence lets researchers study fluid forces, mixing, and wake interactions.</li><li>Passive grids make turbulence through fixed geometry. An active grid adds programmable winglet motion, so speed, angular range, timing, and panel geometry can be varied to mimic atmospheric-like fluctuations, shear, and downstream interactions.</li><li>Water\u2019s lower kinematic viscosity gives comparable Reynolds numbers at lower speeds than air, and the channel gives optical access for flow measurements.</li></ul><h2>Research objective</h2><p>Design, build, and test the grid, then use it to study how grid geometry and motion shape the downstream flow. The long-term goal is to characterize turbulence intensity, length scales, homogeneity, and isotropy.</p><h2>Mechanical design</h2><ul><li>I defined the requirements, reviewed published active and passive grid designs, and developed sketches into SolidWorks CAD.</li><li>An aluminum T-slot frame holds five stainless-steel shafts with 3D-printed winglets, with adjustable brackets and replaceable panels for alignment and reconfiguration.</li><li>Hydrodynamic loading calculations drove the shaft selection, to limit bending and keep the geometry consistent.</li><li>The assembly is removable, so it fits the existing channel without blocking downstream access to the test section.</li><li>The motors stay above the waterline and drive the submerged shafts mechanically. Water-resistant materials and protected connections support long experiments.</li></ul><h2>Control hardware and motion protocols</h2><ul><li>Five NEMA 23 closed-loop stepper motors each drive one shaft, with 3.1 N\u00b7m holding torque and 14-bit encoder feedback. The drivers run from a DC supply of up to 50 V at 1,600 command pulses per revolution.</li><li>An Arduino Mega sends step, direction, and enable signals and coordinates shaft position, rotation rate, and timing. Each channel is independent, so protocols change in software without touching the hardware.</li></ul><ul><li><b>Baseline and fixed grid:</b> compare the empty channel to a grid held at a documented angle, to separate background flow from passive wakes.</li><li><b>Independent random motion:</b> bounded target angles and dwell times assigned separately to each motor.</li><li><b>Correlated random motion:</b> random commands with a chosen memory time, compared at similar angle distributions and flow speeds.</li><li><b>Periodic motion:</b> sinusoidal commands to check timing and response, as a route to repeatable gusts.</li></ul><h2>Flow measurements</h2><ul><li>Laser particle image velocimetry (PIV) and three-dimensional Lagrangian particle tracking (LPT), using near-neutrally buoyant polyamide tracer particles.</li><li>PIV compares particle patterns between successive images of a laser-lit plane to estimate velocity vectors. LPT reconstructs individual 3D particle trajectories from synchronized, calibrated camera views.</li><li>Quantitative particle measurements characterize turbulence statistics and how the turbulence decays downstream.</li></ul><h2>Flow visualization</h2><p>Fluorescent dye under UV light gives a qualitative view of the wakes and mixing behind the moving winglets. It highlights downstream flow structures, wake deformation, flow separation, and possible vortex shedding.</p><h2>Future directions</h2><ul><li>Longer PIV and LPT recordings to quantify turbulence intensity, velocity spectra, and flow uniformity.</li><li>Repeated trials to see how grid-motion protocols affect the flow and to establish repeatability.</li></ul><h2>Presentation and publication</h2><p>I presented this work at the 6th annual Frontiers of Energy Research poster session and published an abstract on programmable turbulence (APS Division of Fluid Dynamics, 2026). The research was supported by the Vagelos Integrated Program in Energy Research (VIPER).</p>",
 tags:"SolidWorks \u00b7 C++ \u00b7 Arduino \u00b7 Stepper control \u00b7 PIV / LPT \u00b7 Flow visualization"},
{id:"echo-pro",cat:2,h:150,title:"Echo Pro Mobility Cane",sub:"An AI-guided cane that detects obstacles and steers the user around them",meta:"MakeMIT \u00d7 Harvard Hardware Hackathon \u00b7 2026",
 facts:[["3 awards","Viam, deFlex, Communication"],["On-device","ML inference, no cloud"],["5 s","calibrated avoidance maneuver"]],
 body:"<p>Echo Pro is a self-guided mobility cane built on a Raspberry Pi. A forward-facing camera feeds a machine-learning model that detects people and objects, and a motorized wheel at the base of the cane steers the user around them while they keep walking forward.</p><div class='vwrap'><iframe src='https://www.youtube-nocookie.com/embed/6VvcRcvRXNA' title='Project video' loading='lazy' allow='accelerometer; encrypted-media; picture-in-picture; fullscreen' allowfullscreen></iframe></div><a class='vlink small' href='https://youtu.be/6VvcRcvRXNA' target='_blank' rel='noopener'><b>▶ Open on YouTube</b><span>If the player doesn’t load, watch it there.</span></a><h2>The problem</h2><p>The white cane has changed little in decades. It is a passive, contact-based tool, so it can tell a user that something is in the way but not how to get around it. After watching a blind person circle the same obstacle with no guidance, we named the gap: detection without guidance. Age-related vision loss is a growing public health concern, so we set out to close that gap.</p><h2>How it works</h2><ul><li><b>Detect:</b> live video from the camera runs through a Viam machine-learning model that detects humans and objects.</li><li><b>Decide:</b> the system reads each detection's bounding-box size, position, and orientation to compute a directional avoidance vector.</li><li><b>Steer:</b> the motorized wheel turns to that angle, guiding the user around the obstacle.</li><li><b>Recover:</b> after a calibrated five-second avoidance maneuver, the wheel re-centers to restore the original path.</li></ul><p>All inference runs on the device itself, with no cloud processing, which keeps the user's camera data private.</p><h2>My role</h2><p>I worked on brainstorming and feature development, built the software backend on Viam, and handled troubleshooting, testing, and fine-tuning of the hardware and software together. The team was split into mechanical and electronics groups, and the software was the hardest part for a mechanically-minded team: setting up and programming the Raspberry Pi, getting the model working with help from Viam staff, and writing the Python that drives the wheel for obstacle avoidance and path correction.</p><h2>What's next</h2><ul><li>Move from reactive avoidance to proactive navigation with turn-by-turn guidance.</li><li>Broaden the training dataset for different environments.</li><li>Add ultrasonic and LiDAR sensors for better spatial awareness.</li><li>Add haptic feedback, then run structured pilot tests with visually impaired users.</li></ul><p>The team won three awards at MakeMIT \u00d7 Harvard 2026: Best Use of Viam, Best Use of deFlex (Transcend), and Communication. <a href=\"https://devpost.com/software/ai-detection-and-steering-crane\" target=\"_blank\" rel=\"noopener\">Read the Devpost write-up</a>.</p>",
 tags:"Python · Viam · Raspberry Pi · Onshape · Edge AI · Hardware integration"},
{id:"sung-lab",cat:1,h:175,title:"Sung Lab: Impedance Pump Research",sub:"Impedance pumps for soft robots and blood-flow support",meta:"Sung Robotics Lab, Penn · Funded Undergraduate Researcher · 2025–2026",
 facts:[["10+","strain conditions tested"]],
 body:"<p>I designed an underwater single-tube robot that steers and propels itself with a Liebau impedance pump, and experimentally measured how 10+ different strains on the tube change flow in closed-loop Liebau-driven systems.</p><h2>Why it matters: a healthcare application</h2><p>When the heart cannot move enough blood, or the blood is not carrying enough oxygen, clinicians can place a pump in the circulation to artificially supplement blood flow rate or oxygenation. Impedance pumps can do that job. They drive fluid through a flexible tube by periodically squeezing it at an off-center spot, with no impeller or rotating parts in the flow path.</p><h2>Testing it like an artery</h2><p>To study that use, I run the pump in a closed-loop flow setup. Different valves in the loop set the resistance of each path, standing in for the pathways and resistances of the arteries the pump would sit in. On this bench model I can change one thing at a time, including how much the tube is strained, and measure how the flow rate responds. Across 10+ strain conditions, that shows how to tune a pump to hit a target flow.</p><h2>Related builds</h2><ul><li><b>Liebau swimming robot:</b> a swimmer driven by an impedance pump.</li><li><b>Iris impedance pump:</b> an impedance pump with radial actuation.</li><li><b>Strain tests:</b> how tube strain affects flow rate.</li></ul>",
 tags:"Soft robotics · Experimental fluids · Biomedical flow · Prototyping"},
{id:"liu-lab",cat:1,h:150,title:"Liu Lab at Emory: Machine Learning Tutorial Site",sub:"A teaching website on machine learning for computational chemistry",meta:"Liu Laboratory, Emory University \u00b7 Student Researcher \u00b7 Jun\u2013Dec 2024",
 facts:[["100%","accuracy on the PAH training set"],["PAHs","classified as carcinogenic or not"],["RDKit","Morgan fingerprints"],["ROC","curves to evaluate the model"]],
 body:"<p>I built a public tutorial website that introduces machine learning for computational chemistry, written for high school students and early learners.</p><h2>Machine learning model</h2><p>I expanded on an existing supervised classification pipeline, then developed and trained a model that distinguishes carcinogenic molecules from non-carcinogenic ones from their molecular structure alone. Using scikit-learn and RDKit, each polycyclic aromatic hydrocarbon (PAH) is encoded as a Morgan fingerprint, a numerical description of its structure. The model compares each molecule with the others and learns which structural patterns go with carcinogenicity.</p><p>The trained model classified every PAH in the training set correctly, for 100% accuracy, and I evaluated it with ROC curves. The tutorial site walks learners through that same pipeline.</p><h2>Teaching modules</h2><ul><li>Chemoinformatics basics and dataset configuration.</li><li>Using chemistry APIs such as PubChem and RDKit.</li><li>Evaluating a classifier with ROC curves.</li></ul>",
 tags:"Python \u00b7 scikit-learn \u00b7 RDKit \u00b7 PubChem \u00b7 Web development"},
{id:"emg-glove",cat:2,h:20,title:"EMG Assistive Glove",sub:"A wearable glove that senses muscle signals and drives the fingers to restore and strengthen hand function",meta:"Independent engineering project \u00b7 Science fair",
 facts:[["~$197","total cost"],["300 ms","per movement"],["3","EMG sensors, 5 servos"],["100%","correct finger-group detection"]],
 body:"<p>An assistive glove<!--figs:emgfin|The assembled glove and wrist brace--> that senses the movement a person intends to make and mimics and strengthens it. Three EMG (electromyography) sensors on the forearm read muscle signals, an Arduino-class microcontroller interprets them, and five micro servos on a 3D-printed wrist brace pull threads sewn into the glove to curl the fingers.</p><h2>The problem</h2><p>Conditions such as rheumatoid arthritis, carpal tunnel syndrome, Dupuytren\u2019s contracture, and Parkinson\u2019s disease can limit how well a person uses their hands. The World Health Organization estimates that about 4% of people worldwide live with functional disabilities that make basic tasks difficult. Most prostheses replace a missing limb entirely, while devices that supplement an existing, impaired hand are a largely unexplored market, and few are affordable.</p><h2>How it works</h2><!--figs:emgwire|Wiring: three EMG sensors in, five servos out;emgcode|Arduino code--><ul><li><b>Sense:</b> each of the three EMG sensors is assigned to a group of fingers: thumb, index and middle, and ring and pinky. A sensor reads the electrical signal a muscle produces when it contracts.</li><li><b>Interpret:</b> the microcontroller reads each sensor on an analog pin. When a signal rises above that finger group\u2019s threshold, it counts as an intended contraction.</li><li><b>Act:</b> the matching micro servos turn and pull a thread attached to each finger, curling it. The glove carries out each movement within about 300 milliseconds.</li></ul><h2>Design and build</h2><!--figs:emg3d|SolidWorks model of the glove system--><ul><li>Modeled the wrist brace that holds the servos in SolidWorks, then 3D printed it and mounted each servo onto it.</li><li>Bought the sensors, servos, microcontroller, battery pack, and glove off the shelf, so the work was in the integration.</li><li>Wired the system with solder and jump wires: the sensors run from the microcontroller\u2019s 5 V supply, and the servos run from a separate 4.5 V battery pack.</li><li>Sewed a thread through each finger of the glove and tied the other end to its servo.</li></ul><h2>Testing and calibration</h2><!--figs:emgtest|Watching the signal on the Serial Plotter--><p>Finding where on the arm to place each sensor took trial and error: I tried locations, moved each finger one at a time, and watched for signal changes. The sensors were sensitive enough that any finger movement caused some fluctuation, so I used the Arduino Serial Plotter to graph each sensor and chose a threshold range that picked out one specific finger group. In the plotted signal, the line stays flat until the finger contracts, then spikes high and low, and that spike sets the threshold.</p><h2>Results</h2><!--figs:emgp|Science fair poster--><ul><li>The sensors correctly identified which finger group was contracted every time.</li><li>The servos closed my hand fully, and each movement completed within a 300-millisecond window.</li><li>Total cost was about $197: three EMG sensors ($150), five micro servos ($10), the microcontroller ($17), and about $20 for wiring, solder, batteries, filament, and the glove. Many prostheses and similar devices cost up to thousands of dollars.</li></ul><h2>What\u2019s next</h2><ul><li>Isolate each individual finger by combining signal ranges from multiple sensors.</li><li>Add a mechanism that helps open the hand instead of relying on its natural resting position.</li><li>Make the design more compact and sleek.</li></ul>",
 tags:"SolidWorks \u00b7 3D printing \u00b7 Arduino (C++) \u00b7 EMG sensing \u00b7 Servo control \u00b7 Soldering"},
{id:"desalination",cat:2,h:175,title:"Solar-Powered Desalination Device",sub:"A portable electrochemical desalination cell that turns salt water into drinking water for disaster relief",meta:"Team project with Daylia Lian and Vikram Bora \u00b7 Science fair",
 facts:[["14.5 h to 4 h","100 mL, after two design improvements"],["3.5\u00d7","faster at 12 V than 5 V"],["30 cells","make 3 L in 14 hours"],["$20","estimated manufacturing cost"]],
 body:"<p>A portable, solar-powered<!--figs:desset|The experimental setup: solar cells, pumps, and the desalination cell--> electrochemical desalination device built from readily available materials, to give people drinking water after hurricanes and other disasters that cut off the water supply on coasts and islands. I built it with Daylia Lian and Vikram Bora.</p><h2>The problem</h2><p>Storm surges contaminate freshwater with salt water, as Hurricane Ian did in Fort Myers, and power loss and broken pipes cut off supply as well. Bottled water from emergency agencies often does not reach the people who need it most, and shipping it creates plastic waste. We wanted a device that could run on a small solar panel with no grid power.</p><h2>How it works</h2><!--figs:desstack|Expanded view of each layer in the cell;descell|How ions move through the cell--><p>The cell uses electrochemistry rather than boiling or high-pressure pumping. Salt water flows through chambers separated by ion-exchange membranes. At the cathode, an electrolyte is reduced by electrons from the power source. That draws sodium ions (Na+) out of the salt water through a cation exchange membrane and pushes chloride ions (Cl-) through an anion exchange membrane into a second chamber. The electrolyte then flows to the anode, where it is oxidized and releases the electrons back. The net result is that the external power moves salt ions from one chamber to the other, so one stream becomes fresh and the other saltier. The rate of desalination is proportional to the current.</p><h2>Design</h2><ul><li><b>Membranes:</b> Fumasep FAS-PET-75 anion membrane and Nafion 117 cation membranes.</li><li><b>Electrolyte:</b> a water-soluble vitamin B complex, a safer and cheaper option than the ferro/ferricyanide we also tested.</li><li><b>Electrodes:</b> graphite.</li><li><b>Chambers:</b> 3D printed in PLA, with nylon mesh spacers.</li><li><b>Setup:</b> small pumps circulate the electrolyte and the salt water, and solar panels can power the cell directly.</li></ul><h2>Testing</h2><p>Each trial started with two containers of 100 mL of 35 ppt saline solution. We measured salt content with a conductivity meter every 30 minutes, tracked the initial desalination speed over the first hour, and timed how long it took to reach 250 ppm, the recommended limit for sodium in drinking water. We varied electrolyte, electrolyte concentration, pump speed, voltage, and chamber thickness.</p><h2>Results</h2><!--figs:desplot|Initial design: 100 mL in 14.5 hours;desimp|5 V versus 12 V;desbars|Effect of electrolyte, concentration, design, and pump speed--><ul><li><b>Initial design:</b> 4 mm chambers and a 5 V supply desalinated 100 mL in 14.5 hours, and the cell ran directly from a solar panel.</li><li><b>Improvement 1, voltage:</b> raising the voltage from 5 V to 12 V cut that to about 4 hours, 3.5 times faster. The trade-off is faster electrode corrosion.</li><li><b>Improvement 2, thinner chambers:</b> cutting the chamber thickness from 4 mm to 2 mm brought it to about 9 hours, 1.6 times faster.</li><li><b>Parameters:</b> desalination speed rose with electrolyte concentration and voltage, was similar for ferrocyanide and vitamin B2, and did not depend strongly on pump speed. Vitamin B complex proved a viable electrolyte.</li><li><b>Scale:</b> a bank of 30 cells running on vitamin B complex could desalinate 3 liters of salt water in 14 hours, about what an adult needs to drink in a day.</li></ul><h2>Cost</h2><!--figs:desp|Science fair poster--><p>The home-built device cost about $80: roughly $50 in materials, including a $15 10 W solar panel and $13 for electrodes and electrolyte, plus two hours of labor at $15 per hour. We estimate bulk manufacturing would cut the cost by about a factor of four, to roughly $20, which would pay for itself after about 14 one-liter bottles of water at $1.50 each.</p><h2>What\u2019s next</h2><ul><li>Study how the vitamin B concentration affects speed.</li><li>Test other electrode materials that are cheaper, faster, and withstand higher voltage.</li><li>Make the cell even thinner.</li><li>Add a filter to remove particulate matter.</li></ul>",
 tags:"Electrochemistry \u00b7 Ion-exchange membranes \u00b7 3D printing (PLA) \u00b7 Solar power \u00b7 Data collection \u00b7 Cost analysis"},

    C.splice(bi,1)}
